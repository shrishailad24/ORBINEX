<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="orbinex-core" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="orbinex-orbit" x1="10" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Outer Reticle -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 3"/>

  <!-- Target crosshairs -->
  <line x1="50" y1="6" x2="50" y2="14" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="86" x2="50" y2="94" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="50" x2="14" y2="50" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="50" x2="94" y2="50" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />

  <!-- Primary Orbital Ring -->
  <ellipse cx="50" cy="50" rx="34" ry="14" transform="rotate(-28 50 50)" stroke="url(#orbinex-orbit)" stroke-width="2.2"/>

  <!-- Secondary Counter Orbit -->
  <ellipse cx="50" cy="50" rx="32" ry="12" transform="rotate(38 50 50)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Orbiting Satellite -->
  <g transform="rotate(-28 50 50)">
    <circle cx="84" cy="50" r="3.5" fill="#00E5FF" />
    <circle cx="84" cy="50" r="1.5" fill="#FFFFFF" />
    <line x1="84" y1="44" x2="84" y2="56" stroke="#D4AF37" stroke-width="1.2" />
  </g>

  <!-- Central Earth Core -->
  <circle cx="50" cy="50" r="17" fill="#050B14" stroke="url(#orbinex-core)" stroke-width="2"/>
  <ellipse cx="50" cy="50" rx="8.5" ry="17" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="33" y1="50" x2="67" y2="50" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Pulsing Optical Core -->
  <circle cx="50" cy="50" r="4" fill="#00E5FF"/>
  <circle cx="50" cy="50" r="1.8" fill="#FFFFFF"/>
</svg>
